; Boîtier Relance pour Domyos Run100 : capteur de vitesse Bluetooth (FTMS), en lecture seule.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@1.4.3
test_ignore = *

; Module optocoupleur à masse d'entrée commune : G commun sur GND, IN sur les GPIO, appui = état haut.
[env:esp32dev_masse_commune]
extends = env:esp32dev
build_flags = -DRELANCE_OPTO_MASSE_COMMUNE

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
