; Boîtier Relance pour Domyos Run100 : capteur de vitesse Bluetooth (FTMS), en lecture seule.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@1.4.3
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
